<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truck Scadenze</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #eef2f6;
  margin: 0;
  padding: 18px;
  color: #172b43;
}
header {
  background: #142b45;
  color: white;
  padding: 22px;
  text-align: center;
  border-radius: 15px;
}
.card {
  background: white;
  padding: 18px;
  margin-top: 18px;
  border-radius: 14px;
  box-shadow: 0 3px 10px #0001;
}
h2 { margin-top: 0; }
label {
  font-weight: bold;
  display: block;
  margin-top: 10px;
  margin-bottom: 5px;
  font-size: 14px;
}
input[type="date"] {
  width: 100%;
  padding: 12px;
  margin-bottom: 12px;
  border: 1px solid #ccc;
  border-radius: 10px;
  box-sizing: border-box;
  font-size: 15px;
}
button {
  width: 100%;
  padding: 16px;
  margin-top: 12px;
  border: 0;
  border-radius: 10px;
  background: #1476d4;
  color: white;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
}
.status {
  font-weight: bold;
  color: #1476d4;
  line-height: 1.6;
}
.history {
  border-bottom: 1px solid #ddd;
  padding: 9px 0;
}
</style>
</head>
<body>

<header>
  <h1>🚛 TRUCK SCADENZE</h1>
  <p>Il tuo assistente per il tachigrafo</p>
</header>

<!-- Selettore della data di riferimento personalizzata -->
<div class="card">
  <h2>📅 Data di Riferimento</h2>
  <label for="dataInizio">Calcola partendo dal giorno:</label>
  <input type="date" id="dataInizio">
</div>

<div class="card">
  <h2>💳 Carta conducente</h2>
  <p id="cardStatus" class="status"></p>
  <button onclick="register('card')">
    HO SCARICATO LA CARTA
  </button>
</div>

<div class="card">
  <h2>🚛 Memoria camion</h2>
  <p id="truckStatus" class="status"></p>
  <button onclick="register('truck')">
    HO SCARICATO LA MEMORIA
  </button>
</div>

<div class="card">
  <h2>🔔 Promemoria</h2>
  <p>Un giorno prima e il giorno della scadenza.</p>
  <button onclick="enableNotifications()">
    ATTIVA NOTIFICHE
  </button>
</div>

<div class="card">
  <h2>📋 Storico scarichi</h2>
  <div id="history"></div>
</div>

<script>
// Imposta di default la data odierna nel selettore all'apertura
document.getElementById('dataInizio').valueAsDate = new Date();

const intervals = {
  card: 28,
  truck: 90
};

let records = JSON.parse(
  localStorage.getItem("truckRecords") || "[]"
);

function save() {
  localStorage.setItem(
    "truckRecords",
    JSON.stringify(records)
  );
}

function register(type) {
  const dataInput = document.getElementById('dataInizio').value;
  let dataDaRegistrare = dataInput ? new Date(dataInput) : new Date();

  if (!confirm("Confermi di aver scaricato i dati per la data selezionata?")) return;

  records.push({
    type,
    date: dataDaRegistrare.toISOString()
  });

  save();
  render();
}

function lastRecord(type) {
  return records.filter(r => r.type === type)
    .sort((a,b) => new Date(b.date)-new Date(a.date))[0];
}

function renderStatus(type, element) {
  const record = lastRecord(type);
  const name = type === "card"
    ? "Carta conducente"
    : "Memoria camion";

  if (!record) {
    element.innerHTML = name +
      "<br>Nessuno scarico registrato.";
    return;
  }

  const last = new Date(record.date);
  const due = new Date(last);
  due.setDate(due.getDate() + intervals[type]);

  // Calcola i giorni rimanenti rispetto alla data di riferimento scelta dall'utente
  const dataRiferimentoInput = document.getElementById('dataInizio').value;
  const dataRiferimentoCorrente = dataRiferimentoInput ? new Date(dataRiferimentoInput) : new Date();

  const days = Math.ceil(
    (due - dataRiferimentoCorrente) / 86400000
  );

  element.innerHTML =
    name +
    "<br>Ultimo scarico: " + last.toLocaleDateString("it-IT") +
    "<br>Prossima scadenza: " + due.toLocaleDateString("it-IT") +
    "<br>" + (days < 0
      ? "⚠️ SCADENZA SUPERATA"
      : "Giorni rimanenti: " + days);
}

function render() {
  renderStatus("card", document.getElementById("cardStatus"));
  renderStatus("truck", document.getElementById("truckStatus"));

  const history = document.getElementById("history");
  history.innerHTML = "";

  records.slice().reverse().forEach(r => {
    const div = document.createElement("div");
    div.className = "history";
    div.textContent =
      (r.type === "card" ? "💳 Carta conducente" : "🚛 Memoria camion") +
      " — " + new Date(r.date).toLocaleDateString("it-IT");
    history.appendChild(div);
  });

  if (!records.length) {
    history.textContent = "Nessuno scarico registrato.";
  }
}

// Aggiorna i calcoli a schermo se l'utente cambia la data nel selettore
document.getElementById('dataInizio').addEventListener('change', render);

async function enableNotifications() {
  if (!("Notification" in window)) {
    alert("Il browser non supporta le notifiche.");
    return;
  }

  const permission = await Notification.requestPermission();

  if (permission === "granted") {
    alert("Notifiche autorizzate. Ricorda: questa versione HTML non garantisce sveglie automatiche quando è chiusa.");
  } else {
    alert("Autorizza le notifiche nelle impostazioni del browser.");
  }
}

render();
</script>

</body>
</html>
